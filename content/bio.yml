# Everything on the Bio page.

# Each list item is one paragraph.
bio:
  - >
    Ella King is an Assistant Professor of Chemical and Biological Engineering
    and of Materials Science and Engineering at Northwestern University.
  - >
    Before joining Northwestern, Ella King was a Simons Junior Fellow at NYU.
    She received a Ph.D. in physics from Harvard University and B.S. from
    Stanford University. Ella has been recognized with an “Emerging Soft
    Matter Excellence Award,” as a speaker in the “Distinguished Young
    Scholars Seminar,” among the “Rising Stars in Soft and Biological Matter”,
    with a Certificate of Distinction in Teaching, and with an NSF Graduate
    Fellowship, among others.

